<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What to Eat? Capsule Machine</title>
<meta name="theme-color" content="#1b0638">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1b0638;
    --ink:#fff;
    --muted:#c9b6ea;
    --card:#fff7fb;
    --card-ink:#4a1a5c;
    --accent:#ff5fae;
    --teal:#6fe3cf;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]){color-scheme:dark}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1b0638; } }
  :root[data-theme="dark"]{ --bg:#1b0638; }
  *{box-sizing:border-box}
  html{background:var(--g3,#1b0638)}
  html,body{margin:0}
  body{position:relative}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    background:var(--bgimg,none) center/cover no-repeat fixed,linear-gradient(180deg,var(--g1) 0%,var(--g2) 45%,var(--g3) 100%) fixed,var(--g3);
    min-height:100svh;color:var(--ink);
    font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;overflow-x:hidden;
  }
  h1,.sub,.actions{position:relative;z-index:1}
  h1{margin:0;font-size:clamp(20px,5vw,28px);font-weight:800;letter-spacing:.2px;text-align:center}
  .sub{margin:0;color:var(--muted);font-size:15px;text-align:center;min-height:24px}

  #stage{
    z-index:1;
    container-type:inline-size;
    width:min(92vw,460px,calc((100svh - 150px) * .914));
    aspect-ratio:1199/1312;
    position:relative;
  }
  #machine{position:absolute;inset:0;transform-origin:50% 92%}
  #machine img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}

  #dial{
    position:absolute;
    left:46.96%;top:71.88%;
    width:10.34cqw;height:10.34cqw;
    border:0;padding:0;border-radius:50%;cursor:pointer;
    background-repeat:no-repeat;
    background-size:100cqw auto;
    background-position:-46.96cqw -78.65cqw;
    -webkit-tap-highlight-color:transparent;
  }
  #dial:focus-visible{outline:3px solid #fff;outline-offset:4px}
  #dial:disabled{cursor:default}
  #ring{
    position:absolute;left:calc(46.96% - 1.6cqw);top:calc(71.88% - 1.6cqw);
    width:13.5cqw;height:13.5cqw;border-radius:50%;
    border:3px solid #fff;opacity:0;pointer-events:none;
    animation:pulse 1.8s ease-out infinite;
  }
  #ring.off{display:none}
  @keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.5);opacity:0}}

  .pick-glow{
    position:absolute;left:0;top:0;width:15cqw;height:15cqw;border-radius:50%;
    background:radial-gradient(circle,#fff 0,rgba(255,255,255,.55) 40%,transparent 70%);
    pointer-events:none;opacity:0;
  }
  .flyball{position:absolute;left:0;top:0;width:13.2cqw;height:13.2cqw;pointer-events:none;will-change:transform}
  .clip{position:absolute;inset:0;pointer-events:none;z-index:5}
  .clip.glass{clip-path:inset(0 0 34.8% 0)}          /* only the glass globe is visible */
  .clip.hole{clip-path:inset(83.5% 38.3% 0 45%)}     /* only the little chute opening */

  /* capsule drawing (SVG halves) */
  .cap{position:relative;width:100%;aspect-ratio:1;filter:drop-shadow(0 8px 10px rgba(0,0,0,.32))}
  .half{position:absolute;inset:0;will-change:transform}
  .half svg{width:100%;height:100%;display:block;overflow:visible}
  .half.top{clip-path:inset(0 0 50% 0)}
  .half.bot{clip-path:inset(50% 0 0 0)}
  .fl{width:100%;height:100%;will-change:transform}

  .actions{display:flex;gap:10px;margin-top:6px}
  button.pill{
    font:inherit;font-weight:700;font-size:15px;color:#fff;background:rgba(255,255,255,.12);
    border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 16px;cursor:pointer;
  }
  button.pill:hover{background:rgba(255,255,255,.22)}
  button.pill.primary{background:var(--accent);border-color:var(--accent)}

  /* result overlay */
  #result{
    position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(20,4,40,.82);backdrop-filter:blur(4px);z-index:20;padding:16px;
  }
  #result.show{display:flex;animation:fade .3s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  #box{position:relative;width:190px;height:190px;margin-top:150px}
  #bigcap{position:absolute;inset:0;z-index:2;transform:scale(0);--c:#fff}
  #bigcap .half.top{transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .7s ease}
  #bigcap .cap::after{transition:opacity .2s}
  #bigcap.pop{animation:pop .6s cubic-bezier(.3,1.5,.5,1) forwards}
  @keyframes pop{0%{transform:scale(0) rotate(-20deg)}100%{transform:scale(1) rotate(0)}}
  #bigcap.wiggle{animation:wig .5s ease-in-out}
  @keyframes wig{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(5deg)}}
  #bigcap.open .half.top{transform:translate(-70%,-90%) rotate(-40deg);opacity:0}
  #bigcap.open .cap::after{opacity:0}
  #slip{
    position:absolute;left:50%;top:50%;z-index:1;
    width:min(82vw,300px);padding:16px 18px;text-align:center;
    background:var(--card);color:var(--card-ink);border-radius:18px;
    box-shadow:0 12px 30px rgba(0,0,0,.4),0 0 0 4px rgba(255,255,255,.35);
    transform:translate(-50%,-30%) scale(.25);opacity:0;
    transition:transform 1s cubic-bezier(.2,1.2,.35,1),opacity .35s;
  }
  #slip.up{transform:translate(-50%,-112%) scale(1);opacity:1}
  #slip small{display:block;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#b0569a}
  #slip b{display:block;font-size:clamp(26px,8vw,38px);line-height:1.1;font-weight:800;margin-top:2px;overflow-wrap:anywhere}
  #again{margin-top:26px;opacity:0;transition:opacity .4s .5s}
  #again.up{opacity:1}

  /* edit answers */
  #editor{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(20,4,40,.8);z-index:30;padding:16px;
  }
  #editor.show{display:flex}
  .panel{width:min(92vw,400px);background:#3f1470;border:1.5px solid rgba(255,255,255,.25);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
  .panel h2{margin:0;font-size:20px}
  .panel p{margin:0;font-size:14px;color:var(--muted)}
  textarea{
    width:100%;height:220px;border-radius:12px;border:1.5px solid rgba(255,255,255,.3);
    background:rgba(0,0,0,.25);color:#fff;font:16px/1.4 inherit;font-family:inherit;padding:10px;resize:none;
  }

  /* decorative background */
  .bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .bg .stars{position:absolute;inset:0;
    background-image:
      radial-gradient(2px 2px at 8% 12%,#fff,transparent 60%),radial-gradient(1.5px 1.5px at 22% 30%,#cfe3ff,transparent 60%),
      radial-gradient(2px 2px at 35% 8%,#fff,transparent 60%),radial-gradient(1.5px 1.5px at 48% 22%,#ffd6f0,transparent 60%),
      radial-gradient(2px 2px at 63% 10%,#fff,transparent 60%),radial-gradient(1.5px 1.5px at 78% 26%,#cfe3ff,transparent 60%),
      radial-gradient(2px 2px at 91% 14%,#fff,transparent 60%),radial-gradient(1.5px 1.5px at 14% 52%,#ffd6f0,transparent 60%),
      radial-gradient(2px 2px at 88% 48%,#fff,transparent 60%),radial-gradient(1.5px 1.5px at 6% 78%,#cfe3ff,transparent 60%),
      radial-gradient(2px 2px at 94% 80%,#fff,transparent 60%),radial-gradient(1.5px 1.5px at 30% 90%,#ffd6f0,transparent 60%),
      radial-gradient(2px 2px at 70% 92%,#fff,transparent 60%);
    animation:twinkle 4s ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.45}to{opacity:1}}
  .bg .orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
  .bg .o1{width:50vmax;height:50vmax;left:-15vmax;top:-12vmax;background:var(--g1)}
  .bg .o2{width:45vmax;height:45vmax;right:-14vmax;bottom:-12vmax;background:var(--g2)}
  .bg .f{position:absolute;font-size:clamp(26px,4vw,44px);opacity:.28;animation:floaty 9s ease-in-out infinite alternate}
  @keyframes floaty{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-22px) rotate(10deg)}}
  @media (prefers-reduced-motion:reduce){.bg .stars,.bg .f{animation:none}}
  #stage::before{content:"";position:absolute;inset:-12% -14%;z-index:-1;
    background:radial-gradient(ellipse at 50% 55%,rgba(255,130,210,.38),rgba(130,110,255,.22) 40%,transparent 68%)}
  #stage::after{content:"";position:absolute;left:8%;right:8%;bottom:-2.5%;height:6%;z-index:-1;
    background:radial-gradient(ellipse at center,rgba(10,0,30,.55),transparent 70%)}

  :root{--g1:#1f4ed8;--g2:#3a1d96;--g3:#1b0638}
  .bg .dim{position:absolute;inset:0;background:rgba(10,0,30,var(--dim,0))}
  .bg.nodeco .stars,.bg.nodeco .orb,.bg.nodeco .f{display:none}
  .bg.hasimg .orb{display:none}
  #bgEditor{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,4,40,.7);z-index:30;padding:16px}
  #bgEditor.show{display:flex}
  #bgEditor .panel{max-height:92svh;overflow-y:auto}
  .swatches{display:flex;gap:10px;flex-wrap:wrap}
  .sw{width:48px;height:48px;border-radius:14px;border:2px solid rgba(255,255,255,.45);cursor:pointer;padding:0}
  .sw:hover{border-color:#fff}
  .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .row3 label,.rng,.chk{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  .rng{flex-direction:row;align-items:center;gap:10px}.rng input{flex:1}
  .chk{flex-direction:row;align-items:center;gap:8px}
  input[type=color]{width:100%;height:40px;border:2px solid rgba(255,255,255,.35);border-radius:10px;background:none;padding:2px;cursor:pointer}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  #bgNote{min-height:18px;color:#ffd6f0;font-size:13px}

  .glare{position:absolute;left:19.2%;top:18.7%;width:64.2%;height:47.6%;border-radius:50%;pointer-events:none;z-index:6;
    background:radial-gradient(ellipse at 27% 20%,rgba(255,255,255,.20),transparent 36%),
               radial-gradient(ellipse at 50% 52%,transparent 64%,rgba(190,210,255,.14) 100%)}
  #box{width:220px;height:220px;margin-top:170px}
  #capEditor{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,4,40,.7);z-index:30;padding:16px}
  #capEditor.show{display:flex}
  #capEditor .panel{max-height:92svh;overflow-y:auto}
  #capPrev{width:132px;margin:0 auto;--c:#ff4fa3}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font:inherit;font-weight:700;font-size:14px;color:#fff;padding:5px 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row2 label{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  .actions{flex-wrap:wrap;justify-content:center}

  .pb{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
  .pb .rot{position:absolute;inset:0;will-change:transform}
  .pb .gl{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  #pile{z-index:4}

  /* prettier panels */
  .panel{width:min(92vw,420px);padding:22px 20px;gap:14px;border-radius:28px;
    background:linear-gradient(160deg,rgba(112,62,196,.92),rgba(42,16,96,.95));
    border:1.5px solid rgba(255,255,255,.3);
    box-shadow:0 28px 70px rgba(8,0,28,.6),inset 0 1px 0 rgba(255,255,255,.4);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
  #editor.show .panel,#bgEditor.show .panel,#capEditor.show .panel{animation:rise .4s cubic-bezier(.2,1,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
  .panel h2{margin:0;font-size:25px;font-weight:800;color:#fff;text-shadow:0 2px 14px rgba(255,140,210,.55)}
  .panel p{margin:0;font-size:14px;color:#cdb9f5;line-height:1.35}
  .panel .lbl,.lbl{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#e0d0ff;margin:2px 0 -4px}
  #menuCount{margin:-4px 0 0;text-align:right;color:#ffc4ea}
  .chip{padding:7px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);transition:transform .15s,background .2s,box-shadow .2s}
  .chip:hover{transform:translateY(-1px);background:rgba(255,255,255,.2)}
  .chip.on{background:linear-gradient(135deg,#ff6fb5,#ff8a5b);border-color:transparent;box-shadow:0 6px 16px rgba(255,95,174,.45)}
  .sw{width:52px;height:52px;border-radius:16px;box-shadow:0 5px 12px rgba(0,0,0,.3);transition:transform .15s}
  .sw:hover{transform:translateY(-2px) scale(1.05)}
  .sw.on{outline:3px solid #fff;outline-offset:2px}
  button.pill{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08));border-color:rgba(255,255,255,.4);padding:7px 17px;transition:transform .15s,box-shadow .2s,background .2s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  button.pill:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.28)}
  button.pill:active{transform:translateY(0) scale(.97)}
  button.pill.primary{background:linear-gradient(135deg,#ff6fb5,#ff8a5b);border-color:transparent;box-shadow:0 8px 20px rgba(255,95,174,.45)}
  textarea{border-radius:16px;background:rgba(14,4,40,.45);border:1.5px solid rgba(255,255,255,.25);line-height:1.55;padding:12px 14px}
  textarea:focus{outline:2px solid #ff8ac8;outline-offset:1px}
  input[type=color]{height:44px;border-radius:14px;border:2px solid rgba(255,255,255,.5);padding:3px;background:rgba(255,255,255,.08)}
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  input[type=color]::-webkit-color-swatch{border:0;border-radius:9px}
  input[type=range]{accent-color:#ff6fb5;height:26px}
  #capPrev{width:150px;margin:6px auto 10px;position:relative;isolation:isolate}
  #capPrev::before{content:"";position:absolute;inset:-26%;z-index:-1;background:radial-gradient(circle,rgba(255,150,220,.5),transparent 66%)}
  .actions{gap:10px}

  /* ===== owner-only editing, save bar ===== */
  body:not(.owner) .owner-only{display:none!important}
  #saveBar{position:fixed;z-index:25;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;justify-content:flex-end;align-items:center;gap:8px;font-size:14px;pointer-events:none}
  #saveBar>*{pointer-events:auto}
  #saveMsg{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(20,4,40,.6);color:var(--muted);padding:5px 12px;border-radius:999px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #saveBar.dirty #saveMsg{color:#ffd6f0}
  #saveBar button.pill{padding:5px 16px;flex:none}
  button.pill:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}

  /* ===== responsive: phone, iPad, laptop ===== */
  :root{--avail:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  @supports (height:100dvh){:root{--avail:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;max-width:100%}
  @supports (overflow:clip){html,body{overflow-x:clip}}
  body{max-width:100%}
  #stage::before{inset:-8% -6%}
  body{min-height:var(--avail);padding:10px 12px;gap:8px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #stage{width:min(94vw,520px,calc((var(--avail) - 170px) * .914));-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #dial::after{content:"";position:absolute;inset:-10px;border-radius:50%}
  textarea{font-size:16px;height:min(220px,34vh)}
  input,select{font-size:16px}
  .panel{max-height:calc(var(--avail) - 24px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  #editor,#bgEditor,#capEditor,#result{padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  @media (pointer:coarse){
    button.pill,.chip{min-height:44px}
    .sw{width:56px;height:56px}
    input[type=range]{height:34px}
  }
  @media (min-width:700px){
    h1{font-size:34px}
    .sub{font-size:18px}
    #stage{width:min(80vw,640px,calc((var(--avail) - 200px) * .914))}
    button.pill{font-size:17px;padding:9px 22px}
    .panel{width:min(86vw,520px)}
    #saveBar{left:20px;right:20px;top:calc(env(safe-area-inset-top,0px) + 16px)}
  }
  @media (max-height:600px){
    #box{width:150px;height:150px;margin-top:110px}
    #again{margin-top:16px}
    #slip{padding:10px 14px}
    textarea{height:30vh}
  }
  @media (max-height:520px){
    body{gap:3px;padding:6px 10px}
    h1{font-size:18px}
    .sub{font-size:13px;min-height:0}
    #stage{width:min(94vw,calc((var(--avail) - 104px) * .914))}
    .actions{margin-top:2px}
    button.pill{padding:4px 12px;font-size:14px}
    #saveBar{top:calc(env(safe-area-inset-top,0px) + 4px);left:6px;right:6px;font-size:12px}
  }
</style>
</head>
<body>
  <div id="saveBar" class="owner-only"><span id="saveMsg" role="status" aria-live="polite"></span><button class="pill primary" id="saveNow" type="button">Save</button></div>
  <div class="bg" aria-hidden="true">
    <div class="dim"></div><div class="orb o1"></div><div class="orb o2"></div><div class="stars"></div>
    <span class="f" style="left:6%;top:18%;animation-delay:-1s">🍜</span>
    <span class="f" style="left:84%;top:14%;animation-delay:-4s">🍔</span>
    <span class="f" style="left:10%;top:62%;animation-delay:-2s">🍕</span>
    <span class="f" style="left:88%;top:58%;animation-delay:-6s">🥖</span>
    <span class="f" style="left:20%;top:84%;animation-delay:-3s">🌮</span>
    <span class="f" style="left:76%;top:86%;animation-delay:-5s">🍟</span>
    <span class="f" style="left:3%;top:40%;animation-delay:-7s">🍗</span>
    <span class="f" style="left:94%;top:34%;animation-delay:-8s">🥟</span>
  </div>
  <h1>What should I eat? 🍜🍔</h1>
  <p class="sub" id="hint">Hungry? Tap the red dial to pick your meal!</p>

<script>
(function(){
  var APP = window.APP = {state:{}, mode:'viewer', dirty:false, art:null};
  var DRAFT='capsuleDraftV2', REBASE='capsuleRebaseV2';
  function hash(s){ var h=5381,i; for(i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return h+':'+s.length; }
  var baseStr='{}';
  try{ baseStr=document.getElementById('state').textContent.trim()||'{}'; APP.state=JSON.parse(baseStr)||{}; }catch(e){ APP.state={}; }
  var base=hash(baseStr);

  // bring back unsaved edits (only ever exist in the owner's own browser)
  try{
    var rb=sessionStorage.getItem(REBASE);
    if(rb){ sessionStorage.removeItem(REBASE); APP.state=JSON.parse(rb); APP.dirty=true; }
    else{
      var d=JSON.parse(localStorage.getItem(DRAFT)||'null');
      if(d && d.base===base && d.state){ APP.state=d.state; APP.dirty=!d.saved; }
    }
  }catch(e){}

  var bar=document.getElementById('saveBar'), msg=document.getElementById('saveMsg'), btn=document.getElementById('saveNow');
  var saving=false, err='';
  function paint(){
    bar.classList.toggle('dirty',APP.dirty);
    msg.textContent = saving ? 'Saving…' : err ? err : APP.dirty ? 'Unsaved changes' : 'Saved';
    btn.disabled = saving || (!APP.dirty && !err);
  }
  function writeDraft(saved){
    var rec={base:base,saved:saved,state:APP.state};
    try{ localStorage.setItem(DRAFT,JSON.stringify(rec)); }
    catch(e){ try{ var c=JSON.parse(JSON.stringify(APP.state)); if(c.bg) c.bg.img=null; rec.state=c; localStorage.setItem(DRAFT,JSON.stringify(rec)); }catch(e2){} }
  }
  // every edit is kept as a draft straight away; Save publishes it
  APP.touch=function(){ APP.dirty=true; err=''; writeDraft(false); paint(); };

  function buildDoc(){
    var tpl=JSON.parse(document.getElementById('tpl').textContent);
    var s=JSON.stringify(APP.state).replace(/</g,'\\u003c');
    var t=JSON.stringify(tpl).replace(/</g,'\\u003c');
    return tpl.replace('@@'+'STATE@@',function(){return s;}).replace('@@'+'TPL@@',function(){return t;});
  }
  APP.save=async function(){
    if(saving) return;
    if(APP.mode==='local'){ writeDraft(true); APP.dirty=false; err=''; paint(); return; }
    if(APP.mode!=='owner' || !APP.art || !APP.dirty) return;
    saving=true; err=''; paint();
    try{ await APP.art.publish(buildDoc()); }   // the page reloads itself with the saved version
    catch(e){
      saving=false; var c=e && e.code;
      if(c==='conflict'){ try{ sessionStorage.setItem(REBASE,JSON.stringify(APP.state)); }catch(x){} return; }
      err = (c==='not_writer'||c==='not_granted'||c==='capability_disabled'||c==='not_declared') ? 'Saving isn’t available here'
          : c==='rate_limited' ? 'Too fast — try again in a moment'
          : c==='too_large' ? 'Too big to save — use a smaller image'
          : 'Could not save — try again';
      paint();
    }
  };
  btn.addEventListener('click',function(){ APP.save(); });

  function setMode(m){ APP.mode=m; document.body.classList.toggle('owner',m==='owner'||m==='local'); paint(); }
  if(!window.claude || typeof window.claude.use!=='function'){ setMode('local'); }   // opened as a plain file
  else{
    setMode('viewer');                                                              // shared link = read-only
    Promise.all([window.claude.use('artifact'),window.claude.use('user')]).then(function(r){
      var art=r[0], user=r[1]; if(!art||!user) return;
      return Promise.all([user.isOwner(),user.canEdit()]).then(function(v){
        if(v[0]||v[1]){ APP.art=art; setMode('owner'); }
      });
    }).catch(function(){});
  }
})();
</script>

    var o=APP.state.cap, S=window.__capStyle, hx=/^#[0-9a-f]{6}$/i; if(!o) return;

  function glareSVG(){ var id='gl'+(uid++); return '<svg class="gl" viewBox="0 0 100 100"><defs><linearGradient id="'+id+'r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".55" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".45"/></linearGradient></defs>'+topGlare(id)+botGlare()+'</svg>'; }
  function capHTML(color, slip, cs, opts){
    cs = cs || resolveStyle();
    var noG = opts && opts.noGlare;
    var col = cs.mode==='custom' ? cs.color : color;
    var id = 'cp'+(uid++);
    var light = mix(col,'#ffffff',.55), dark = mix(col,'#000000',.38), tint = mix(col,'#ffffff',.82);
    var hasPat = cs.pattern && cs.pattern!=='none';
    var pat = hasPat ? patDef(cs.pattern, id+'p', cs.patColor, cs.scale) : '';
    var bot = '<svg viewBox="0 0 100 100"><defs>'+pat+
      '<radialGradient id="'+id+'b" cx=".4" cy=".35" r=".78"><stop offset="0" stop-color="'+light+'" stop-opacity=".62"/><stop offset=".6" stop-color="'+col+'" stop-opacity=".78"/><stop offset="1" stop-color="'+dark+'" stop-opacity=".96"/></radialGradient>'+
      '<radialGradient id="'+id+'s" cx=".5" cy=".5" r=".5"><stop offset=".72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></radialGradient></defs>'+
      (slip ? '<g transform="rotate(-14 50 66)"><rect x="29" y="55" width="42" height="20" rx="3" fill="#fff7fb"/><rect x="34" y="60" width="32" height="2.6" rx="1.3" fill="#e7b6d3"/><rect x="34" y="65" width="24" height="2.6" rx="1.3" fill="#e7b6d3"/></g>' : '')+
      '<circle cx="50" cy="50" r="48" fill="url(#'+id+'b)"/>'+
      (hasPat ? '<circle cx="50" cy="50" r="48" fill="url(#'+id+'p)" opacity=".6"/>' : '')+
      '<circle cx="50" cy="50" r="48" fill="url(#'+id+'s)"/>'+
      (noG?'':botGlare())+
      '<rect x="2.5" y="50" width="95" height="3.2" fill="#fff" opacity=".32"/></svg>';
    var top = '<svg viewBox="0 0 100 100"><defs>'+pat+
      '<radialGradient id="'+id+'t" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="'+tint+'" stop-opacity=".16"/><stop offset=".7" stop-color="'+tint+'" stop-opacity=".26"/><stop offset="1" stop-color="'+col+'" stop-opacity=".62"/></radialGradient>'+
      '<linearGradient id="'+id+'r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".55" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".45"/></linearGradient></defs>'+
      '<circle cx="50" cy="50" r="48" fill="url(#'+id+'t)"/>'+
      (hasPat ? '<circle cx="50" cy="50" r="48" fill="url(#'+id+'p)" opacity=".34"/>' : '')+
      (noG?'':topGlare(id))+
      '<rect x="2.5" y="46.8" width="95" height="3.2" fill="#fff" opacity=".4"/>'+
      '<line x1="2.5" y1="49.6" x2="97.5" y2="49.6" stroke="#000" stroke-opacity=".25" stroke-width=".8"/></svg>';

  }
  window.__capHTML = capHTML;
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function t(x,y,s,rot){ return 'translate(' + x + 'cqw,' + y + 'cqw) scale(' + s + ') rotate(' + (rot||0) + 'deg)'; }

  function tx(v){ return 'translateX('+v+'cqw)'; }
  function ty(v){ return 'translateY('+v+'cqw)'; }
  function makeFly(color, cs, parent, x0, y0){
    var root=document.createElement('div'); root.className='flyball';
    var fy=document.createElement('div'); fy.className='fl';
    var fr=document.createElement('div'); fr.className='fl';
    fr.innerHTML=capHTML(color,false,cs);
    fy.appendChild(fr); root.appendChild(fy); parent.appendChild(root);
    root.style.transform=tx(x0); fy.style.transform=ty(y0);
    return {root:root,fy:fy,fr:fr};
  }
  var EIO='cubic-bezier(.45,0,.25,1)', FALL='cubic-bezier(.5,0,.9,.6)', RISE='cubic-bezier(.1,.5,.4,1)';

  // ---------- live capsule pile ----------
  var CIRC={x:615,y:560,r:356}, FLOORY=850, BR=68, G=2300, E=.32, N=12;
  function hsl2hex(h,sa,l){ sa/=100; l/=100;
    var k=function(n){return (n+h/30)%12}, a=sa*Math.min(l,1-l);
    var f=function(n){ return Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))))); };
    return '#'+[f(0),f(8),f(4)].map(function(x){return ('0'+x.toString(16)).slice(-2)}).join(''); }
  function vivid(h){ return hsl2hex(h,96,(h>190&&h<290)?64:56); }
  function freshHue(){
    var best=0,bd=-1;
    for(var t=0;t<30;t++){ var h=Math.random()*360, md=360;
      balls.forEach(function(b){ var d=Math.abs(h-b.hue); d=Math.min(d,360-d); if(d<md) md=d; });
      if(md>bd){bd=md;best=h;} }
    return best;
  }
  var pile=$('pile'), balls=[], awake=false, lastT=0, calm=0;

  function makeBall(color,x,y,sc){
    var cs=resolveStyle();
    var el=document.createElement('div'); el.className='pb';
    el.style.width=el.style.height=cx(2*BR)+'cqw';
    el.innerHTML='<div class="rot">'+capHTML(color,false,cs,{noGlare:true})+'</div>'+glareSVG();
    pile.appendChild(el);
    var b={el:el,rot:el.firstChild,x:x,y:y,vx:0,vy:0,a:Math.random()*6.28,w:0,s:sc||1,color:color,cs:cs,falling:false};
    balls.push(b); return b;
  }
  function draw(b){
    b.el.style.transform='translate('+cx(b.x-BR)+'cqw,'+cx(b.y-BR)+'cqw) scale('+b.s+')';
    b.rot.style.transform='rotate('+b.a+'rad)';
  }
  function solve(){
    var i,j,a,b,dx,dy,d,nx,ny,ov,vn,jj,min=2*BR-1;
    for(i=0;i<balls.length;i++){ a=balls[i]; if(a.falling) continue;

        if(d<min*min && d>1e-6){
          d=Math.sqrt(d); nx=dx/d; ny=dy/d; ov=(min-d)/2;

        }
      }
    }
    for(i=0;i<balls.length;i++){ a=balls[i]; if(a.falling) continue;

  }
  window.__refreshPile=function(){
    balls.forEach(function(b){ b.cs=resolveStyle(); b.rot.innerHTML=capHTML(b.color,false,b.cs,{noGlare:true}); });
  };
  // build the pile and let it settle before the first frame
  (function(){
    var base=Math.random()*360;
    for(var i=0;i<N;i++){ var hh=(base+i*360/N+(Math.random()-.5)*14+360)%360;

    balls.forEach(function(b){ b.vx=b.vy=b.w=0; draw(b); });
  })();

  machine.addEventListener('pointerdown',function(e){

  });

      {transform:ty(cx(1228)-half), offset:.7, easing:EIO},

  function burst(){
    var box=$('box'), cols=['#ffd23f','#ff5fae','#6fe3cf','#8ab4ff','#ffffff','#b79bff'];

      var d=document.createElement('i');
      var sz=5+Math.random()*7;
      d.style.cssText='position:absolute;left:50%;top:50%;width:'+sz+'px;height:'+sz+'px;border-radius:'+(Math.random()<.4?'2px':'50%')+';background:'+cols[i%cols.length]+';z-index:3;pointer-events:none';
      box.appendChild(d);
      var ang=Math.random()*Math.PI*2, dist=100+Math.random()*110;
      var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist*.9-40;
      var an=d.animate([
        {transform:'translate(-50%,-50%) scale(1) rotate(0deg)',opacity:1},
        {transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px)) scale(.3) rotate('+(Math.random()*360)+'deg)',opacity:0}
      ],{duration:900+Math.random()*500,easing:'cubic-bezier(.12,.75,.3,1)'});
      an.onfinish=(function(el){return function(){el.remove()}})(d);
    }
  }

  async function showResult(color, cs){
    var pick = answers[Math.floor(Math.random()*answers.length)] || '…';
    $('answer').textContent = pick;
    bigcap.style.setProperty('--c', color);
    bigcap.innerHTML = capHTML(color, true, cs);
    bigcap.className = '';
    slip.className = '';
    again.className = 'pill primary';
    result.classList.add('show');
    void bigcap.offsetWidth;
    bigcap.classList.add('pop');
    await wait(650);
    bigcap.classList.remove('pop');
    bigcap.style.transform = 'scale(1)';
    bigcap.classList.add('wiggle');
    await wait(550);
    bigcap.classList.remove('wiggle');
    bigcap.classList.add('open');
    burst();
    await wait(220);
    slip.classList.add('up');
    again.classList.add('up');
  }

  function reset(){
    refill();
    result.classList.remove('show');
    bigcap.style.transform = '';
    busy = false;
    dial.disabled = false;
    ring.classList.remove('off');
    hint.textContent = 'Hungry? Tap the red dial to pick your meal!';
  }

  dial.addEventListener('click', spin);
  again.addEventListener('click', reset);

  // edit answers
  $('editBtn').addEventListener('click', function(){
    $('answersText').value = answers.join('\n');
    $('editor').classList.add('show'); updCount();
  });
  function updCount(){ var n=$('answersText').value.split('\n').filter(function(l){return l.trim()}).length; $('menuCount').textContent=n+' dishes on the menu'; }
  function liveMenu(){
    var l=$('answersText').value.split('\n').map(function(s){return s.trim()}).filter(Boolean);
    answers = l.length ? l : DEFAULTS.slice();
    APP.state.menu = l.length ? l : null;
    APP.touch();
  }
  $('answersText').addEventListener('input',function(){ updCount(); liveMenu(); });
  $('editor').addEventListener('click',function(e){ if(e.target===this) this.classList.remove('show'); });
  $('resetBtn').addEventListener('click', function(){ $('answersText').value = DEFAULTS.join('\n'); updCount(); liveMenu(); });
  $('saveBtn').addEventListener('click', function(){
    liveMenu();
    $('editor').classList.remove('show');
    APP.save();
  });
})();

<script>
(function(){
    var $=function(id){return document.getElementById(id)};
  var PRESETS=[
    ['#1f4ed8','#3a1d96','#1b0638'],
    ['#ff8a5b','#c2338f','#2d0b5a'],
    ['#2dd4bf','#2563eb','#1e1b4b'],
    ['#ffb3d9','#8b5cf6','#2e1065'],
    ['#0b1026','#2b1b6b','#0a0420'],
    ['#fde68a','#fb7185','#6d28d9']
  ];
  var DEF={g:PRESETS[0].slice(),img:null,dim:0,deco:true};
  var st={g:DEF.g.slice(),img:null,dim:0,deco:true};
  var bg=document.querySelector('.bg'), root=document.documentElement, note=$('bgNote');
  var hex=/^#[0-9a-f]{6}$/i;

  function apply(){

<script>
(function(){

})();
</script>

parent;box-shadow:0 8px 20px rgba(255,95,174,.45)}\n  textarea{border-radius:16px;background:rgba(14,4,40,.45);border:1.5px solid rgba(255,255,255,.25);line-height:1.55;padding:12px 14px}\n  textarea:focus{outline:2px solid #ff8ac8;outline-offset:1px}\n  input[type=color]{height:44px;border-radius:14px;border:2px solid rgba(255,255,255,.5);padding:3px;background:rgba(255,255,255,.08)}\n  input[type=color]::-webkit-color-swatch-wrapper{padding:0}\n  input[type=color]::-webkit-color-swatch{border:0;border-radius:9px}\n  input[type=range]{accent-color:#ff6fb5;height:26px}\n  #capPrev{width:150px;margin:6px auto 10px;position:relative;isolation:isolate}\n  #capPrev::before{content:\"\";position:absolute;inset:-26%;z-index:-1;background:radial-gradient(circle,rgba(255,150,220,.5),transparent 66%)}\n  .actions{gap:10px}\n\n  /* ===== owner-only editing, save bar ===== */\n  body:not(.owner) .owner-only{display:none!important}\n  #saveBar{position:fixed;z-index:25;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;justify-content:flex-end;align-items:center;gap:8px;font-size:14px;pointer-events:none}\n  #saveBar>*{pointer-events:auto}\n  #saveMsg{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(20,4,40,.6);color:var(--muted);padding:5px 12px;border-radius:999px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}\n  #saveBar.dirty #saveMsg{color:#ffd6f0}\n  #saveBar button.pill{padding:5px 16px;flex:none}\n  button.pill:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}\n\n  /* ===== responsive: phone, iPad, laptop ===== */\n  :root{--avail:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}\n  @supports (height:100dvh){:root{--avail:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}}\n  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;max-width:100%}\n  @supports (overflow:clip){html,body{overflow-x:clip}}\n  body{max-width:100%}\n  #stage::before{inset:-8% -6%}\n  body{min-height:var(--avail);padding:10px 12px;gap:8px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}\n  #stage{width:min(94vw,520px,calc((var(--avail) - 170px) * .914));-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}\n  #dial::after{content:\"\";position:absolute;inset:-10px;border-radius:50%}\n  textarea{font-size:16px;height:min(220px,34vh)}\n  input,select{font-size:16px}\n  .panel{max-height:calc(var(--avail) - 24px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}\n  #editor,#bgEditor,#capEditor,#result{padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}\n  @media (pointer:coarse){\n    button.pill,.chip{min-height:44px}\n    .sw{width:56px;height:56px}\n    input[type=range]{height:34px}\n  }\n  @media (min-width:700px){\n    h1{font-size:34px}\n    .sub{font-size:18px}\n    #stage{width:min(80vw,640px,calc((var(--avail) - 200px) * .914))}\n    button.pill{font-size:17px;padding:9px 22px}\n    .panel{width:min(86vw,520px)}\n    #saveBar{left:20px;right:20px;top:calc(env(safe-area-inset-top,0px) + 16px)}\n  }\n  @media (max-height:600px){\n    #box{width:150px;height:150px;margin-top:110px}\n    #again{margin-top:16px}\n    #slip{padding:10px 14px}\n    textarea{height:30vh}\n  }\n  @media (max-height:520px){\n    body{gap:3px;padding:6px 10px}\n    h1{font-size:18px}\n    .sub{font-size:13px;min-height:0}\n    #stage{width:min(94vw,calc((var(--avail) - 104px) * .914))}\n    .actions{margin-top:2px}\n    button.pill{padding:4px 12px;font-size:14px}\n    #saveBar{top:calc(env(safe-area-inset-top,0px) + 4px);left:6px;right:6px;font-size:12px}\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv id=\"saveBar\" class=\"owner-only\">\u003cspan id=\"saveMsg\" role=\"status\" aria-live=\"polite\">\u003c/span>\u003cbutton class=\"pill primary\" id=\"saveNow\" type=\"button\">Save\u003c/button>\u003c/div>\n  \u003cdiv class=\"bg\" aria-hidden=\"true\">\n    \u003cdiv class=\"dim\">\u003c/div>\u003cdiv class=\"orb o1\">\u003c/div>\u003cdiv class=\"orb o2\">\u003c/div>\u003cdiv class=\"stars\">\u003c/div>\n    \u003cspan class=\"f\" style=\"left:6%;top:18%;animation-delay:-1s\">🍜\u003c/span>\n    \u003cspan class=\"f\" style=\"left:84%;top:14%;animation-delay:-4s\">🍔\u003c/span>\n    \u003cspan class=\"f\" style=\"left:10%;top:62%;animation-delay:-2s\">🍕\u003c/span>\n    \u003cspan class=\"f\" style=\"left:88%;top:58%;animation-delay:-6s\">🥖\u003c/span>\n    \u003cspan class=\"f\" style=\"left:20%;top:84%;animation-delay:-3s\">🌮\u003c/span>\n    \u003cspan class=\"f\" style=\"left:76%;top:86%;animation-delay:-5s\">🍟\u003c/span>\n    \u003cspan class=\"f\" style=\"left:3%;top:40%;animation-delay:-7s\">🍗\u003c/span>\n    \u003cspan class=\"f\" style=\"left:94%;top:34%;animation-delay:-8s\">🥟\u003c/span>\n  \u003c/div>\n  \u003ch1>What should I eat? 🍜🍔\u003c/h1>\n  \u003cp class=\"sub\" id=\"hint\">Hungry? Tap the red dial to pick your meal!\u003c/p>\n\n  \u003cdiv id=\"stage\">\n    \u003cdiv id=\"machine\">\n      \u003cimg id=\"art\" alt=\"Pink capsule machine with colorful capsules inside\" src=\"data:image/webp;base64,UklGRspcAQBXRUJQVlA4WAoAAAAQAAAArgQAHwUAQUxQSBNdAAABGccR2LbNgYRT4f0HVgGc8o/o/wTg/3PW1xTIRdUluxf0e4vM9RYq1dYz05PWeLsDIBM914IA2F6795MAeFnzJMBySlNgBkACJEcrM3BMrVNlVAiHNffqO/QKyamQPD0+Ao/IU21RCigA3mlJnSBpqDsBSBglDYpVTYD3ANTo1cbytyBSvw6BfkdIq0YP9SUEI22F9SGb9SHqcdw2kiNJ+Yc9rt3efSNiAvh61Y2XYUMT/ZRNCW4lcse9AW65VTGYe0M5um5K+/hrWYQnw17DfO9kkVDB9cLcKv8jRaaHEN5ke6KnagG9zP//7r/tNrlhuRO5K5XnPuR2tDuQO/f9/q7rt7b3+v3/v+/WzHoKpbkbaa4ZjVGaxuUySjvjioQU1OOyg3qEXNFh6RvsdGShVBSh9AXOpKK4PCdNKD1IH+BuVP8j7kkTSnM38uyZPUG9B/W4Is2a2XNQuitKPyhN8wcnqMflI5QuFPYExyjdZTEjHZSKjlCaZoOdKnZQeE+QF9jpSEapqCdIFzipQpozc8H0jupOR5o9s8YoTeOK0jRG6RtsofSO6hmj9AUOSzsjlCZkofQLnKBev6lCPigV+Q7IZaWjBHXkbqQNdjrqCa tyle.transform = 'scale(1)';\n    bigcap.classList.add('wiggle');\n    await wait(550);\n    bigcap.classList.remove('wiggle');\n    bigcap.classList.add('open');\n    burst();\n    await wait(220);\n    slip.classList.add('up');\n    again.classList.add('up');\n  }\n\n  function reset(){\n    refill();\n    result.classList.remove('show');\n    bigcap.style.transform = '';\n    busy = false;\n    dial.disabled = false;\n    ring.classList.remove('off');\n    hint.textContent = 'Hungry? Tap the red dial to pick your meal!';\n  }\n\n  dial.addEventListener('click', spin);\n  again.addEventListener('click', reset);\n\n  // edit answers\n  $('editBtn').addEventListener('click', function(){\n    $('answersText').value = answers.join('\\n');\n    $('editor').classList.add('show'); updCount();\n  });\n  function updCount(){ var n=$('answersText').value.split('\\n').filter(function(l){return l.trim()}).length; $('menuCount').textContent=n+' dishes on the menu'; }\n  function liveMenu(){\n    var l=$('answersText').value.split('\\n').map(function(s){return s.trim()}).filter(Boolean);\n    answers = l.length ? l : DEFAULTS.slice();\n    APP.state.menu = l.length ? l : null;\n    APP.touch();\n  }\n  $('answersText').addEventListener('input',function(){ updCount(); liveMenu(); });\n  $('editor').addEventListener('click',function(e){ if(e.target===this) this.classList.remove('show'); });\n  $('resetBtn').addEventListener('click', function(){ $('answersText').value = DEFAULTS.join('\\n'); updCount(); liveMenu(); });\n  $('saveBtn').addEventListener('click', function(){\n    liveMenu();\n    $('editor').classList.remove('show');\n    APP.save();\n  });\n})();\n\u003c/script>\n  \u003cdiv id=\"capEditor\">\n    \u003cdiv class=\"panel\">\n      \u003ch2>🎀 Capsule style\u003c/h2>\n      \u003cdiv id=\"capPrev\">\u003c/div>\n      \u003cp class=\"lbl\">Pattern\u003c/p>\n      \u003cdiv class=\"chips\" id=\"patChips\">\u003c/div>\n      \u003cdiv class=\"row2\">\n        \u003clabel>Pattern color\u003cinput type=\"color\" id=\"patColor\">\u003c/label>\n        \u003clabel>Pattern size\u003cinput type=\"range\" id=\"patScale\" min=\"50\" max=\"200\">\u003c/label>\n      \u003c/div>\n      \u003cp class=\"lbl\">Capsule color\u003c/p>\n      \u003cdiv class=\"chips\" id=\"modeChips\">\u003c/div>\n      \u003clabel class=\"row2\" style=\"grid-template-columns:1fr\">\u003cspan style=\"font-size:14px;color:var(--muted)\">Your color\u003c/span>\u003cinput type=\"color\" id=\"capColor\">\u003c/label>\n      \u003cdiv class=\"actions\" style=\"justify-content:flex-end;margin:0\">\n        \u003cbutton class=\"pill\" id=\"capReset\">Reset\u003c/button>\n        \u003cbutton class=\"pill primary\" id=\"capDone\">Save\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv id=\"bgEditor\">\n    \u003cdiv class=\"panel\">\n      \u003ch2>🎨 Background\u003c/h2>\n      \u003cp>Pick a style, set your own colors, or upload a picture.\u003c/p>\n      \u003cdiv class=\"swatches\" id=\"swatches\">\u003c/div>\n      \u003cdiv class=\"row3\">\n        \u003clabel>Top\u003cinput type=\"color\" id=\"c1\">\u003c/label>\n        \u003clabel>Middle\u003cinput type=\"color\" id=\"c2\">\u003c/label>\n        \u003clabel>Bottom\u003cinput type=\"color\" id=\"c3\">\u003c/label>\n      \u003c/div>\n      \u003cdiv class=\"row\">\n        \u003cbutton class=\"pill\" id=\"upBtn\">🖼 Upload image\u003c/button>\n        \u003cbutton class=\"pill\" id=\"rmImg\">Remove image\u003c/button>\n        \u003cinput type=\"file\" id=\"file\" accept=\"image/*\" hidden>\n      \u003c/div>\n      \u003clabel class=\"rng\">Darken \u003cinput type=\"range\" id=\"dim\" min=\"0\" max=\"70\" value=\"0\">\u003c/label>\n      \u003clabel class=\"chk\">\u003cinput type=\"checkbox\" id=\"deco\" checked> Show stars &amp; floating food\u003c/label>\n      \u003cdiv id=\"bgNote\">\u003c/div>\n      \u003cdiv class=\"actions\" style=\"justify-content:flex-end;margin:0\">\n        \u003cbutton class=\"pill\" id=\"bgReset\">Reset\u003c/button>\n        \u003cbutton class=\"pill primary\" id=\"bgDone\">Save\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003cscript>\n(function(){\n    var $=function(id){return document.getElementById(id)};\n  var PRESETS=[\n    ['#1f4ed8','#3a1d96','#1b0638'],\n    ['#ff8a5b','#c2338f','#2d0b5a'],\n    ['#2dd4bf','#2563eb','#1e1b4b'],\n    ['#ffb3d9','#8b5cf6','#2e1065'],\n    ['#0b1026','#2b1b6b','#0a0420'],\n    ['#fde68a','#fb7185','#6d28d9']\n  ];\n  var DEF={g:PRESETS[0].slice(),img:null,dim:0,deco:true};\n  var st={g:DEF.g.slice(),img:null,dim:0,deco:true};\n  var bg=document.querySelector('.bg'), root=document.documentElement, note=$('bgNote');\n  var hex=/^#[0-9a-f]{6}$/i;\n\n  function apply(){\n    root.style.setProperty('--g1',st.g[0]);\n    root.style.setProperty('--g2',st.g[1]);\n    root.style.setProperty('--g3',st.g[2]);\n    root.style.setProperty('--bgimg',st.img?'url(\"'+st.img+'\")':'none');\n    bg.style.setProperty('--dim',st.dim/100);\n    bg.classList.toggle('nodeco',!st.deco);\n    bg.classList.toggle('hasimg',!!st.img);\n    $('c1').value=st.g[0];$('c2').value=st.g[1];$('c3').value=st.g[2];\n    $('dim').value=st.dim;$('deco').checked=st.deco;\n    var sws=document.querySelectorAll('.sw'); for(var q=0;q\u003csws.length;q++) sws[q].classList.toggle('on',PRESETS[q].join()===st.g.join());\n  }\n  function save(){\n    note.textContent='';\n    APP.state.bg={g:st.g.slice(),img:st.img,dim:st.dim,deco:st.deco};\n    APP.touch();\n  }\n  function load(){\n    try{\n      var o=APP.state.bg; if(!o) return;\n      if(Array.isArray(o.g)&&o.g.length===3&&o.g.every(function(c){return hex.test(c)})) st.g=o.g;\n      if(typeof o.img==='string'&&o.img.indexOf('data:image/')===0) st.img=o.img;\n      if(typeof o.dim==='number') st.dim=Math.max(0,Math.min(70,o.dim));\n      if(typeof o.deco==='boolean') st.deco=o.deco;\n    }catch(e){}\n  }\n\n  // swatches\n  PRESETS.forEach(function(p){\n    var b=document.createElement('button');\n    b.className='sw'; b.type='button'; b.setAttribute('aria-label','Use this color style');\n    b.style.background='linear-gradient(180deg,'+p[0]+','+p[1]+' 50%,'+p[2]+')';\n    b.addEventListener('click',function(){ st.g=p.slice(); apply(); save(); });\n    $('swatches').appendChild(b);\n  });\n  ['c1','c2','c3'].forEach(function(id,i){\n    $(id).addEventListener('input',function(){ st.g[i]=this.value; apply(); });\n    $(id).addEventListener('change',save);\n  });\n  $('dim').addEventListener('input',function(){ st.dim=+this.value; apply(); });\n  $('dim').addEventListener('change',save);\n  $('deco').addEventListener('change',function(){ st.deco=this.checked; apply(); save(); });\n\n  // upload (resized to keep it light)\n  $('upBtn').addEventListener('click',function(){ $('file').click(); });\n  $('file').addEventListener('change',function(){\n    var f=this.files&&this.files[0]; if(!f) return;\n    var fr=new FileReader();\n    fr.onerror=function(){ note.textContent='Could not read that file.'; };\n    fr.onload=function(){\n      var im=new Image();\n      im.onerror=function(){ note.textContent='That does not look like an image.'; };\n      im.onload=function(){\n        var max=1400, k=Math.min(1,max/Math.max(im.width,im.height));\n        var cv=document.createElement('canvas');\n        cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k);\n        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);\n        st.img=cv.toDataURL('image/jpeg',.8);\n        if(st.dim===0) st.dim=20;\n        apply(); save();\n      };\n      im.src=fr.result;\n    };\n    fr.readAsDataURL(f);\n    this.value='';\n  });\n  $('rmImg').addEventListener('click',function(){ st.img=null; apply(); save(); });\n\n  $('bgReset').addEventListener('click',function(){\n    st={g:DEF.g.slice(),img:null,dim:0,deco:true}; apply(); save();\n  });\n  $('bgBtn').addEventListener('click',function(){ $('bgEditor').classList.add('show'); });\n  $('bgDone').addEventListener('click',function(){ $('bgEditor').classList.remove('show'); APP.save(); });\n  $('bgEditor').addEventListener('click',function(e){ if(e.target===this) this.classList.remove('show'); });\n\n  load(); apply();\n})();\n\u003c/script>\n\n\u003cscript>\n(function(){\n  var $=function(id){return document.getElementById(id)};\n  var S=window.__capStyle, hex=/^#[0-9a-f]{6}$/i;\n  var DEF=JSON.parse(JSON.stringify(window.__capDefault));\n  var PATS=[['none','Plain'],['stripes','Stripes'],['dots','Dots'],['stars','★ Stars'],['hearts','♥ Hearts'],['checker','Checker'],['zigzag','Zigzag'],['random','🎲 Random']];\n  var MODES=[['match','🌈 Vibrant mix'],['custom','One color']];\n\n  function load(){\n    try{\n      var o=null; if(!o) return;\n      if(PATS.some(function(p){return p[0]===o.pattern})) S.pattern=o.pattern;\n      if(hex.test(o.patColor)) S.patColor=o.patColor;\n      if(typeof o.scale==='number') S.scale=Math.max(.5,Math.min(2,o.scale));\n      if(o.mode==='match'||o.mode==='custom') S.mode=o.mode;\n      if(hex.test(o.color)) S.color=o.color;\n    }catch(e){}\n  }\n  function save(){ APP.state.cap=JSON.parse(JSON.stringify(S)); APP.touch(); if(window.__refreshPile) window.__refreshPile(); }\n\n  function chips(box,list,key){\n    box.innerHTML='';\n    list.forEach(function(p){\n      var b=document.createElement('button'); b.type='button'; b.className='chip'+(S[key]===p[0]?' on':''); b.textContent=p[1];\n      b.addEventListener('click',function(){ S[key]=p[0]; save(); render(); });\n      box.appendChild(b);\n    });\n  }\n  function render(){\n    chips($('patChips'),PATS,'pattern');\n    chips($('modeChips'),MODES,'mode');\n    $('patColor').value=S.patColor; $('capColor').value=S.color; $('patScale').value=Math.round(S.scale*100);\n    var pv=Object.assign({},S); if(pv.pattern==='random') pv.pattern='stars';\n    $('capPrev').innerHTML=window.__capHTML('#ff4fa3',true,pv);\n  }\n  $('patColor').addEventListener('input',function(){ S.patColor=this.value; render(); });\n  $('patColor').addEventListener('change',save);\n  $('capColor').addEventListener('input',function(){ S.color=this.value; S.mode='custom'; render(); });\n  $('capColor').addEventListener('change',save);\n  $('patScale').addEventListener('input',function(){ S.scale=this.value/100; render(); });\n  $('patScale').addEventListener('change',save);\n  $('capReset').addEventListener('click',function(){ Object.assign(S,JSON.parse(JSON.stringify(DEF))); save(); render(); });\n  $('capBtn').addEventListener('click',function(){ render(); $('capEditor').classList.add('show'); });\n  $('capDone').addEventListener('click',function(){ $('capEditor').classList.remove('show'); APP.save(); });\n  $('capEditor').addEventListener('click',function(e){ if(e.target===this) this.classList.remove('show'); });\n  load(); if(window.__refreshPile) window.__refreshPile();\n})();\n\u003c/script>\n\n\u003cscript type=\"application/json\" id=\"tpl\">@@TPL@@\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>
